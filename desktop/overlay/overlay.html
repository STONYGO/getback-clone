<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>overlay</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
  #c{position:fixed;inset:0;opacity:0;transition:opacity .7s ease;--cc:transparent;--s:20vmin;--a:.42}
  #c.on{opacity:1}
  #c i{position:absolute;width:var(--s);height:var(--s)}
  #c i:nth-child(1){top:0;left:0;background:radial-gradient(circle at 0 0,var(--cc) 0,transparent 68%)}
  #c i:nth-child(2){top:0;right:0;background:radial-gradient(circle at 100% 0,var(--cc) 0,transparent 68%)}
  #c i:nth-child(3){bottom:0;left:0;background:radial-gradient(circle at 0 100%,var(--cc) 0,transparent 68%)}
  #c i:nth-child(4){bottom:0;right:0;background:radial-gradient(circle at 100% 100%,var(--cc) 0,transparent 68%)}
  #c.red{--cc:rgba(244,63,94,var(--a))}
  #c.red i{animation:breathe 2.4s ease-in-out infinite}
  #c.green{--cc:rgba(34,197,94,var(--a))}
  #c.amber{--cc:rgba(245,158,11,calc(var(--a) * .6))}
  @keyframes breathe{50%{opacity:.6}}
  #msg{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:7px 14px;border-radius:999px;
    background:rgba(17,20,27,.72);backdrop-filter:blur(10px);color:#fff;font-size:13px;font-weight:600;opacity:0;transition:opacity .4s;white-space:nowrap}
  #msg.on{opacity:1}
  #bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(22vw,220px);height:4px;border-radius:99px;
    background:rgba(255,255,255,.3);overflow:hidden;opacity:0;transition:opacity .4s}
  #bar.on{opacity:1}
  #bar div{height:100%;width:0;background:#22c55e;transition:width .25s}
</style>
</head>
<body>
<div id="c"><i></i><i></i><i></i><i></i></div>
<div id="msg"></div>
<div id="bar"><div></div></div>
<script>
  const c = document.getElementById("c"), msg = document.getElementById("msg"), bar = document.getElementById("bar"), fill = bar.firstElementChild;
  window.overlayBridge.onUpdate(({ mode, progress = 0, msg: text = "", alpha = 0.42, size = "20vmin" } = {}) => {
    c.style.setProperty("--a", alpha); c.style.setProperty("--s", size);
    c.className = mode ? "on " + mode : "";
    msg.textContent = text; msg.classList.toggle("on", !!mode && !!text);
    bar.classList.toggle("on", mode === "green");
    fill.style.width = (mode === "green" ? Math.round(progress * 100) : 0) + "%";
  });
</script>
</body>
</html>
