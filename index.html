<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<title>GetBack Clone — 姿勢モニター</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e9edf3; --muted:#8b93a3;
    --red:#ff3b3b; --green:#22d36b; --amber:#ffb020; --accent:#4f8cff;
    --corner:transparent; --corner-size:42vmin;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden}
  main{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
  header{display:flex;align-items:center;justify-content:space-between}
  h1{font-size:20px;margin:0;letter-spacing:.02em}
  h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
  .pill{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  .status{display:flex;align-items:center;gap:12px}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--muted);flex:none;box-shadow:0 0 0 4px rgba(255,255,255,.04)}
  .status b{font-size:18px}
  .status p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .stage{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3}
  .stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .stage .hint{position:absolute;inset:auto 0 0 0;padding:8px 10px;font-size:12px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#ddd}
  .stage.hidden-preview video,.stage.hidden-preview canvas{opacity:0}
  .stage.hidden-preview::after{content:"プレビュー非表示（検知は動作中）";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  button{flex:1;min-width:120px;font:inherit;font-size:15px;font-weight:600;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#222733;color:var(--text)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.45}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
  .m{background:#12151b;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .m span{display:block;font-size:11px;color:var(--muted)}
  .m b{font-size:15px;font-variant-numeric:tabular-nums}
  .m.bad b{color:var(--red)} .m.ok b{color:var(--green)} .m.na b{color:var(--muted)}
  details summary{cursor:pointer;font-weight:600}
  label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:14px}
  label small{color:var(--muted);display:block;font-size:11px}
  input[type=range]{width:46%}
  .stats{font-size:13px;color:var(--muted);line-height:1.7}
  .stats b{color:var(--text)}

  /* ===== 四隅オーバーレイ ===== */
  #corners{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0;transition:opacity .45s ease}
  #corners.on{opacity:1}
  #corners i{position:absolute;width:var(--corner-size);height:var(--corner-size)}
  #corners i:nth-child(1){top:0;left:0;background:radial-gradient(circle at 0 0,var(--corner) 0,transparent 70%)}
  #corners i:nth-child(2){top:0;right:0;background:radial-gradient(circle at 100% 0,var(--corner) 0,transparent 70%)}
  #corners i:nth-child(3){bottom:0;left:0;background:radial-gradient(circle at 0 100%,var(--corner) 0,transparent 70%)}
  #corners i:nth-child(4){bottom:0;right:0;background:radial-gradient(circle at 100% 100%,var(--corner) 0,transparent 70%)}
  #corners.red{--corner:rgba(255,40,40,.92)}
  #corners.red i{animation:pulse 1.1s ease-in-out infinite}
  #corners.green{--corner:rgba(30,215,105,.9)}
  @keyframes pulse{50%{opacity:.55}}
  #holdBar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:51;
    width:min(70vw,360px);height:8px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;opacity:0;transition:opacity .3s}
  #holdBar.on{opacity:1}
  #holdBar div{height:100%;width:0;background:var(--green)}
  #toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:52;
    background:rgba(20,22,28,.92);border:1px solid var(--line);padding:9px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;max-width:90vw;text-align:center}
  #toast.on{opacity:1}

  /* ===== キャリブレーション画面 ===== */
  #calib{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
  #calib.on{display:flex}
  #calib h2{margin:0;font-size:22px}
  #calib p{margin:0;color:#c5cbd6;font-size:15px;line-height:1.7;max-width:460px}
  #calibCount{font-size:72px;font-weight:800;font-variant-numeric:tabular-nums;min-height:86px}
  #calibRing{width:120px;height:120px}
  #calibRing circle{fill:none;stroke-width:10}
</style>
</head>
<body>
<main>
  <header>
    <h1>GetBack<small>姿勢モニター（クローン）</small></h1>
    <span class="pill" id="fps">待機中</span>
  </header>

  <section class="card status">
    <div class="dot" id="dot"></div>
    <div><b id="stTitle">カメラを開始してください</b><p id="stSub">初回はキャリブレーションが必要です</p></div>
  </section>

  <section class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div class="hint" id="hint">端末を普段使う位置に固定し、顔と肩が映るようにしてください</div>
  </section>

  <div class="row">
    <button class="primary" id="btnStart">カメラ開始</button>
    <button id="btnCalib" disabled>キャリブレーション</button>
  </div>
  <div class="row">
    <button id="btnMonitor" disabled>監視スタート</button>
    <button id="btnPreview">プレビュー非表示</button>
  </div>

  <section class="card">
    <div class="metrics" id="metrics"></div>
  </section>

  <section class="card">
    <details>
      <summary>設定</summary>
      <label><span>感度<small>高いほど小さなズレで赤になる</small></span><input type="range" id="sens" min="0.5" max="2" step="0.1" value="1"><output id="sensV">1.0</output></label>
      <label><span>赤になるまでの猶予<small>一瞬の動きは無視</small></span><input type="range" id="badDelay" min="0.5" max="5" step="0.5" value="1.5"><output id="badDelayV">1.5秒</output></label>
      <label><span>緑の保持時間<small>この時間キープで元の画面に戻る</small></span><input type="range" id="holdSec" min="1" max="10" step="0.5" value="3"><output id="holdSecV">3秒</output></label>
      <label><span>肩の傾き・首の沈み込みも判定<small>肩が映らない場合は自動で顔のみ判定</small></span><input type="checkbox" id="useShoulder" checked></label>
    </details>
  </section>

  <section class="card stats" id="stats">セッション記録：まだありません</section>
</main>

<div id="corners"><i></i><i></i><i></i><i></i></div>
<div id="holdBar"><div></div></div>
<div id="toast"></div>

<div id="calib">
  <h2>キャリブレーション</h2>
  <p id="calibMsg">端末を普段使う位置に置き、<b>背すじを伸ばした正しい姿勢</b>で画面を見てください。<br>準備ができたら開始を押します。</p>
  <div id="calibCount"></div>
  <svg id="calibRing" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" stroke="#2a2f3a"/><circle id="calibArc" cx="60" cy="60" r="50" stroke="#22d36b" stroke-dasharray="314" stroke-dashoffset="314" transform="rotate(-90 60 60)" stroke-linecap="round"/></svg>
  <div class="row" style="width:min(420px,90vw)">
    <button id="calibCancel">キャンセル</button>
    <button class="primary" id="calibGo">開始</button>
  </div>
</div>

<script type="module">
// デスクトップ版（Electron）では preload が window.gbBridge を提供し、モデル類は同梱ファイルを使う
const BR = window.gbBridge || null;
const CDN = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const REMOTE_MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
const { PoseLandmarker, FilesetResolver } = await import(BR ? "./vendor/vision_bundle.mjs" : CDN);

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("overlay"), ctx = canvas.getContext("2d");
const corners = $("corners"), holdBar = $("holdBar"), holdFill = holdBar.firstElementChild;

/* ---------- 指標定義 ----------
   すべて画像サイズ・顔の大きさで正規化し、端末距離の違いに強くする
   roll   : 両目を結ぶ線の傾き（度）           → 首かしげ
   pitch  : 耳の中点に対する鼻の下がり量 / 顔幅 → うつむき（スマホ首）
   near   : 顔幅 / 画面幅（基準比）             → 画面に顔が近づく＝前のめり
   neck   : 肩中点と耳中点の縦距離 / 肩幅        → 首の沈み込み・猫背
   shTilt : 両肩を結ぶ線の傾き（度）           → 体の傾き
*/
const DEF = {
  roll:   { name:"首の傾き",   unit:"°", base:8,    dir:"abs",  msg:"首が傾いています" },
  pitch:  { name:"うつむき",   unit:"",  base:0.14, dir:"up",   msg:"頭が下がっています" },
  near:   { name:"画面との距離", unit:"×", base:0.18, dir:"ratio",msg:"画面に近づきすぎです" },
  neck:   { name:"首の沈み込み", unit:"",  base:0.12, dir:"down", msg:"背中が丸まっています" },
  shTilt: { name:"肩の傾き",   unit:"°", base:7,    dir:"abs",  msg:"肩が傾いています" },
};
const KEYS = Object.keys(DEF);

const S = {
  landmarker:null, running:false, monitoring:false, lastVideoTime:-1,
  ema:{}, baseline:null, calibrating:false, calibSamples:[],
  state:"idle", badSince:0, goodSince:0, lastSeen:0,
  wakeLock:null, frames:0, fpsT:performance.now(),
  stats:{ start:0, goodMs:0, badMs:0, alerts:0, lastT:0 },
};
const cfg = () => ({
  sens:+$("sens").value, badDelay:+$("badDelay").value*1000,
  holdSec:+$("holdSec").value*1000, useShoulder:$("useShoulder").checked,
});

/* ---------- 保存/復元 ---------- */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem("gb_"+k)); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem("gb_"+k, JSON.stringify(v)); }catch{} },
};
S.baseline = store.get("baseline");
const savedCfg = store.get("cfg");
if (savedCfg) for (const k of ["sens","badDelay","holdSec"]) if (savedCfg[k]!=null) $(k).value = savedCfg[k];
if (savedCfg && savedCfg.useShoulder!=null) $("useShoulder").checked = savedCfg.useShoulder;
function syncCfgLabels(){
  $("sensV").textContent = (+$("sens").value).toFixed(1);
  $("badDelayV").textContent = $("badDelay").value+"秒";
  $("holdSecV").textContent = $("holdSec").value+"秒";
  store.set("cfg",{sens:$("sens").value,badDelay:$("badDelay").value,holdSec:$("holdSec").value,useShoulder:$("useShoulder").checked});
}
["sens","badDelay","holdSec","useShoulder"].forEach(id=>$(id).addEventListener("input",syncCfgLabels));
syncCfgLabels();

/* ---------- UI ヘルパ ---------- */
let toastT;
function toast(msg, ms=2200){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),ms); }
function setStatus(color, title, sub){ $("dot").style.background=color; $("stTitle").textContent=title; $("stSub").textContent=sub||""; BR?.status(title, sub||""); }
// デスクトップ版では画面全体のオーバーレイへ送る（このウィンドウ内には出さない）
function setCorners(mode, progress=0, msg=""){
  if (BR){ BR.overlay({mode:mode||null, progress, msg}); return; }
  corners.className = mode ? "on "+mode : "";
}

/* ---------- カメラ & モデル ---------- */
async function initModel(){
  setStatus("var(--amber)","モデルを読み込み中…","初回のみ数秒かかります");
  const fileset = await FilesetResolver.forVisionTasks(BR ? new URL("./vendor/wasm", location.href).href : CDN+"/wasm");
  const opts = d => ({
    baseOptions:{ modelAssetPath: BR ? new URL("./vendor/pose_landmarker_lite.task", location.href).href : REMOTE_MODEL, delegate:d },
    runningMode:"VIDEO", numPoses:1, minPoseDetectionConfidence:0.5, minTrackingConfidence:0.5,
  });
  try { S.landmarker = await PoseLandmarker.createFromOptions(fileset, opts("GPU")); }
  catch { S.landmarker = await PoseLandmarker.createFromOptions(fileset, opts("CPU")); }
}

async function startCamera(){
  $("btnStart").disabled = true;
  try{
    if (!navigator.mediaDevices?.getUserMedia) throw new Error("このブラウザ/環境ではカメラを使えません（HTTPSで開いてください）");
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user", width:{ideal:640}, height:{ideal:480} }, audio:false });
    video.srcObject = stream;
    await video.play();
    if (!S.landmarker) await initModel();
    S.running = true;
    $("btnStart").textContent = "カメラ動作中";
    $("btnCalib").disabled = false;
    $("btnMonitor").disabled = !S.baseline;
    if (S.baseline){ if (BR) toggleMonitor(true); else setStatus("var(--muted)","準備完了","保存済みのキャリブレーションがあります。「監視スタート」で開始"); }
    else { setStatus("var(--amber)","キャリブレーションしてください","正しい姿勢を登録します"); openCalib(); }
    loop();
  }catch(e){
    console.error(e);
    $("btnStart").disabled = false;
    setStatus("var(--red)","開始できませんでした", e.message || String(e));
  }
}

/* ---------- 指標の計算 ---------- */
const VIS = 0.5;
function computeMetrics(lm, W, H){
  const p = i => ({ x:lm[i].x*W, y:lm[i].y*H, v:lm[i].visibility ?? 1 });
  const nose=p(0), le=p(2), re=p(5), lear=p(7), rear=p(8), ls=p(11), rs=p(12);
  if (nose.v<VIS || le.v<VIS || re.v<VIS) return null;
  const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const ang=(a,b)=>{ let t=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI; if(t>90)t-=180; if(t<-90)t+=180; return t; };
  const earsOk = lear.v>0.3 && rear.v>0.3;
  const earMid = earsOk ? mid(lear,rear) : mid(le,re);
  const faceW = earsOk ? d(lear,rear) : d(le,re)*2.1;
  const m = {
    roll: ang(re,le),
    pitch: (nose.y-earMid.y)/faceW,
    near: faceW/W,
    neck: null, shTilt: null,
  };
  if (ls.v>VIS && rs.v>VIS && ls.y<H*0.98 && rs.y<H*0.98){
    const sm=mid(ls,rs), sw=d(ls,rs);
    if (sw > faceW*0.9){ m.neck=(sm.y-earMid.y)/sw; m.shTilt=ang(rs,ls); }
  }
  return m;
}
function smooth(m){
  const a=0.25;
  for (const k of KEYS){
    if (m[k]==null){ S.ema[k]=null; continue; }
    S.ema[k] = (S.ema[k]==null) ? m[k] : S.ema[k]*(1-a)+m[k]*a;
  }
  return {...S.ema};
}

/* ---------- 判定 ---------- */
function evaluate(m){
  const B=S.baseline, c=cfg(), res={};
  let bad=false, reason="";
  for (const k of KEYS){
    const def=DEF[k];
    if (m[k]==null || !B[k] || ((k==="neck"||k==="shTilt") && !c.useShoulder)){ res[k]={na:true}; continue; }
    const tol = Math.max(def.base, 3*B[k].sd) / c.sens;
    let dev, over;
    if (def.dir==="abs"){ dev=m[k]-B[k].mean; over=Math.abs(dev)>tol; }
    else if (def.dir==="up"){ dev=m[k]-B[k].mean; over=dev>tol; }
    else if (def.dir==="down"){ dev=m[k]-B[k].mean; over=dev<-tol; }
    else { dev=m[k]/B[k].mean-1; over=dev>tol; }
    res[k]={dev,over,tol};
    if (over && !bad){ bad=true; reason=def.msg; }
  }
  return {bad,reason,res};
}

function renderMetrics(m, ev){
  $("metrics").innerHTML = KEYS.map(k=>{
    const def=DEF[k], r=ev?.res?.[k];
    let cls="na", val="—";
    if (m && m[k]!=null){
      if (S.baseline && r && !r.na){
        cls = r.over ? "bad":"ok";
        const pct = Math.min(999,Math.round(Math.abs(r.dev)/r.tol*100));
        val = (def.dir==="ratio" ? (m[k]/S.baseline[k].mean).toFixed(2)+"×" : (def.unit==="°" ? (r.dev>0?"+":"")+r.dev.toFixed(1)+"°" : (r.dev>0?"+":"")+r.dev.toFixed(2))) + ` <small style="color:var(--muted);font-weight:400">${pct}%</small>`;
      } else val = m[k].toFixed(2);
    }
    return `<div class="m ${cls}"><span>${def.name}</span><b>${val}</b></div>`;
  }).join("");
}

/* ---------- 状態遷移 ----------
   normal → (悪い姿勢が badDelay 継続) → red
   red    → (正しい姿勢に戻る)        → green（保持カウント開始）
   green  → (holdSec キープ)          → normal（画面が元に戻る）
   green  → (再び崩れる 0.5秒)         → red
*/
function updateState(ev, now){
  const c=cfg();
  if (ev.bad){ if(!S.badSince) S.badSince=now; S.goodSince=0; }
  else { S.badSince=0; if(!S.goodSince) S.goodSince=now; }

  if (S.state==="normal"){
    if (ev.bad && now-S.badSince>=c.badDelay){ S.state="red"; S.stats.alerts++; vibrate(); }
  } else if (S.state==="red"){
    if (!ev.bad && now-S.goodSince>=250) S.state="green";
  } else if (S.state==="green"){
    if (ev.bad && now-S.badSince>=500) S.state="red";
    else if (!ev.bad && now-S.goodSince>=c.holdSec){ S.state="normal"; toast("👍 正しい姿勢をキープできました"); }
  }

  if (S.state==="red"){ setCorners("red",0,ev.reason); holdBar.classList.remove("on"); setStatus("var(--red)","姿勢が崩れています",ev.reason||"正しい姿勢に戻しましょう"); }
  else if (S.state==="green"){
    const p=Math.min(1,(now-S.goodSince)/c.holdSec);
    setCorners("green",p,"その姿勢をキープ"); if(!BR){ holdBar.classList.add("on"); holdFill.style.width=(p*100)+"%"; }
    setStatus("var(--green)","その姿勢をキープ",`あと ${Math.max(0,(c.holdSec-(now-S.goodSince))/1000).toFixed(1)} 秒`);
  } else {
    setCorners(null); holdBar.classList.remove("on");
    setStatus(ev.bad?"var(--amber)":"var(--green)", ev.bad?"注意":"良い姿勢です", ev.bad?ev.reason:"監視中");
  }

  // 記録
  const dt = S.stats.lastT ? now-S.stats.lastT : 0; S.stats.lastT=now;
  if (dt<1000){ if (S.state==="red") S.stats.badMs+=dt; else S.stats.goodMs+=dt; }
}
function vibrate(){ try{ navigator.vibrate?.([120,80,120]); }catch{} }

function renderStats(){
  const s=S.stats, tot=s.goodMs+s.badMs;
  if (!tot){ return; }
  const mm=ms=>`${Math.floor(ms/60000)}分${Math.floor(ms/1000)%60}秒`;
  $("stats").innerHTML = `セッション：<b>${mm(tot)}</b>　良い姿勢率：<b>${Math.round(s.goodMs/tot*100)}%</b>　警告回数：<b>${s.alerts}</b>回`;
}

/* ---------- 描画（骨格） ---------- */
function drawSkeleton(lm, ok){
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  if (!lm) return;
  const pts=[0,2,5,7,8,11,12], lines=[[7,2],[2,0],[0,5],[5,8],[11,12],[11,7],[12,8]];
  ctx.lineWidth=Math.max(2,W/220); ctx.strokeStyle=ok?"rgba(34,211,107,.9)":"rgba(255,80,80,.9)"; ctx.fillStyle="#fff";
  for (const [a,b] of lines){ if((lm[a].visibility??1)<VIS||(lm[b].visibility??1)<VIS) continue; ctx.beginPath(); ctx.moveTo(lm[a].x*W,lm[a].y*H); ctx.lineTo(lm[b].x*W,lm[b].y*H); ctx.stroke(); }
  for (const i of pts){ if((lm[i].visibility??1)<VIS) continue; ctx.beginPath(); ctx.arc(lm[i].x*W,lm[i].y*H,Math.max(3,W/160),0,7); ctx.fill(); }
}

/* ---------- メインループ ---------- */
function loop(){
  if (!S.running) return;
  if (BR && video.paused && video.srcObject) video.play().catch(()=>{});
  if (video.readyState>=2 && video.currentTime!==S.lastVideoTime && (BR || !document.hidden)){
    S.lastVideoTime=video.currentTime;
    if (canvas.width!==video.videoWidth){ canvas.width=video.videoWidth; canvas.height=video.videoHeight; }
    const now=performance.now();
    const r=S.landmarker.detectForVideo(video, now);
    const lm=r.landmarks?.[0];
    const raw = lm ? computeMetrics(lm, video.videoWidth, video.videoHeight) : null;

    if (raw){
      S.lastSeen=now;
      const m=smooth(raw);
      if (S.calibrating){ S.calibSamples.push(raw); drawSkeleton(lm,true); renderMetrics(m,null); }
      else if (S.baseline){
        const ev=evaluate(m);
        drawSkeleton(lm,!ev.bad); renderMetrics(m,ev);
        if (S.monitoring) updateState(ev, now);
      } else { drawSkeleton(lm,true); renderMetrics(m,null); }
    } else {
      drawSkeleton(null); S.ema={};
      if (S.monitoring && now-S.lastSeen>1500){
        // 顔が見えない間は判定を止め、警告も解除しない（離席・端末を置いた等）
        setStatus("var(--muted)","顔が検出できません","カメラに顔が映るようにしてください");
        S.stats.lastT=0;
      }
    }
    S.frames++;
    if (now-S.fpsT>1000){ $("fps").textContent=`${S.frames} fps`; S.frames=0; S.fpsT=now; renderStats(); }
  }
  // ウィンドウを閉じても計測を続けるため、デスクトップ版はタイマー駆動（約15fps）
  if (BR) setTimeout(loop, 66); else requestAnimationFrame(loop);
}

/* ---------- キャリブレーション ---------- */
const CALIB_MS=4000, MIN_SAMPLES=30;
function openCalib(){
  if (S.monitoring) toggleMonitor(false);
  $("calibMsg").innerHTML="端末を普段使う位置に置き、<b>背すじを伸ばした正しい姿勢</b>で画面を見てください。<br>準備ができたら開始を押します。";
  $("calibCount").textContent=""; $("calibArc").style.strokeDashoffset=314; $("calibGo").disabled=false;
  $("calib").classList.add("on");
}
async function runCalib(){
  $("calibGo").disabled=true;
  for (let i=3;i>0;i--){ $("calibCount").textContent=i; await sleep(800); }
  $("calibCount").textContent="計測中";
  $("calibMsg").innerHTML="そのまま <b>動かずに</b> 画面を見ていてください";
  S.calibSamples=[]; S.calibrating=true;
  const t0=performance.now();
  await new Promise(res=>{
    const tick=()=>{ const p=Math.min(1,(performance.now()-t0)/CALIB_MS);
      $("calibArc").style.strokeDashoffset=314*(1-p);
      if(p<1) requestAnimationFrame(tick); else res(); };
    tick();
  });
  S.calibrating=false;
  const smp=S.calibSamples;
  if (smp.length<MIN_SAMPLES){
    $("calibCount").textContent="失敗";
    $("calibMsg").innerHTML="顔が十分に検出できませんでした。<br>明るい場所で、顔全体が映るようにして再度お試しください。";
    $("calibGo").disabled=false; $("calibGo").textContent="再試行"; return;
  }
  const B={};
  for (const k of KEYS){
    const v=smp.map(s=>s[k]).filter(x=>x!=null);
    if (v.length<smp.length*0.6){ B[k]=null; continue; }
    v.sort((a,b)=>a-b);
    const trim=v.slice(Math.floor(v.length*0.1), Math.ceil(v.length*0.9)); // 外れ値除去
    const mean=trim.reduce((a,b)=>a+b,0)/trim.length;
    const sd=Math.sqrt(trim.reduce((a,b)=>a+(b-mean)**2,0)/trim.length);
    B[k]={mean,sd};
  }
  // 計測中に大きく動いていたら（ブレ大）やり直し
  const unstable = (B.roll && B.roll.sd>4) || (B.pitch && B.pitch.sd>0.08);
  if (unstable){
    $("calibCount").textContent="やり直し";
    $("calibMsg").innerHTML="計測中に頭が動いていました。<br>端末を固定し、静止した状態で再度お試しください。";
    $("calibGo").disabled=false; $("calibGo").textContent="再試行"; return;
  }
  B.at=Date.now(); B.shoulders=!!B.neck;
  S.baseline=B; store.set("baseline",B);
  $("calibCount").textContent="✓";
  $("calibMsg").innerHTML = B.shoulders ? "登録しました（顔＋肩で判定）" : "登録しました（肩が映っていないため顔のみで判定）";
  await sleep(1100);
  $("calib").classList.remove("on"); $("calibGo").textContent="開始";
  $("btnMonitor").disabled=false;
  toggleMonitor(true);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- 監視ON/OFF ---------- */
async function toggleMonitor(on){
  S.monitoring = on ?? !S.monitoring;
  S.state="normal"; S.badSince=0; S.goodSince=0; setCorners(null); holdBar.classList.remove("on");
  $("btnMonitor").textContent = S.monitoring ? "監視ストップ" : "監視スタート";
  BR?.monitoring(S.monitoring);
  $("btnMonitor").classList.toggle("primary", !S.monitoring);
  if (S.monitoring){
    S.stats={start:Date.now(),goodMs:0,badMs:0,alerts:0,lastT:0};
    try{ S.wakeLock = await navigator.wakeLock?.request("screen"); }catch{}
    setStatus("var(--green)","監視中","姿勢が崩れると四隅が赤くなります");
  } else {
    try{ await S.wakeLock?.release(); }catch{} S.wakeLock=null;
    setStatus("var(--muted)","停止中","「監視スタート」で再開");
  }
}
document.addEventListener("visibilitychange", async ()=>{
  if (!document.hidden && S.monitoring){ try{ S.wakeLock = await navigator.wakeLock?.request("screen"); }catch{} }
});

/* ---------- イベント ---------- */
$("btnStart").onclick=startCamera;
if (BR){
  BR.onCommand(cmd=>{
    if (cmd==="calibrate"){ if(!S.running) startCamera(); else openCalib(); }
    else if (cmd==="toggle"){ if(S.baseline && S.running) toggleMonitor(); }
  });
  $("hint").textContent="ウィンドウを閉じてもタスクトレイ／メニューバーで計測を続けます";
  startCamera(); // 起動時に自動開始（保存済みキャリブレーションがあれば即監視）
}
$("btnCalib").onclick=openCalib;
$("calibGo").onclick=runCalib;
$("calibCancel").onclick=()=>{ S.calibrating=false; $("calib").classList.remove("on"); };
$("btnMonitor").onclick=()=>toggleMonitor();
$("btnPreview").onclick=()=>{ const h=$("stage").classList.toggle("hidden-preview"); $("btnPreview").textContent=h?"プレビュー表示":"プレビュー非表示"; };
renderMetrics(null,null);

// 開発用：window.__gb で内部状態を参照可能
window.__gb = { S, computeMetrics, evaluate, updateState, DEF };
</script>
